[book]
title = "Green Chillyz Catering — Project Documentation"
authors = ["WideAngle Media & Technologies"]
description = "Full project handbook for the Green Chillyz Catering website — audit findings, IA, page specs, SEO/CRO strategy, technical architecture, and roadmap."
language = "en"
src = "src"

[preprocessor.index]

[preprocessor.links]

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = ""
no-section-label = false
fold.enable = true
fold.level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true
